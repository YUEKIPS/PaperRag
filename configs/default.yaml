project:
  name: agentic-paper-rag
  timezone: Asia/Shanghai

paths:
  raw_pdfs: data/raw_pdfs
  processed: data/processed
  index: data/index
  eval_questions: data/eval/questions.json

arxiv:
  # M1 seed corpus (LLM / Agent RAG papers)
  paper_ids:
    - "2005.11401"
    - "2201.11903"
    - "2210.03629"
    - "2302.04761"
    - "2303.11366"
    - "2304.03442"
    - "2305.16291"
    - "2305.10601"
    - "2305.15334"
    - "2308.03688"
    - "2310.11511"
    - "2401.15884"
  pdf_url_template: "https://arxiv.org/pdf/{paper_id}.pdf"
  request_delay_seconds: 1.0

ingest:
  chunk_size: 512
  chunk_overlap: 64
  # parser: pymupdf  # M1

index:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  embed_batch_size: 32
  hybrid:
    enabled: true  # M1 prototype: BM25 corpus sidecar + RRF at retrieve time
  vector_store: faiss

retriever:
  top_k: 10
  # Cross-encoder after hybrid/RRF; CPU-friendly default (see D-009 in docs/decisions.md)
  reranker:
    enabled: true
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    candidate_pool: 30

baseline:
  # Non-agentic retrieve-then-stub-generate for pipeline smoke tests
  max_context_chunks: 5

agent:
  enabled: true
  max_grade_rewrite_loops: 2
  max_context_chunks: 5

# OpenAI-compatible chat/completions (defaults target DeepSeek).
# Override with env: DEEPSEEK_API_KEY or OPENAI_API_KEY, OPENAI_BASE_URL, OPENAI_MODEL.
# Set AGENT_GENERATOR=openai (agent grade/rewrite/generate) or BASELINE_GENERATOR=openai (baseline only).
llm:
  base_url: https://api.deepseek.com/v1
  model: deepseek-chat
  timeout_seconds: 120

eval:
  output_dir: data/eval/runs
