<!DOCTYPE html>
<html lang="zh-CN" data-theme="ink">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper RAG</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app-shell" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Sessions">
      <header class="sidebar-brand">
        <div class="brand-mark" aria-hidden="true">§</div>
        <div class="brand-text">
          <span class="brand-name">Paper RAG</span>
          <span class="brand-sub">论文 Agentic 问答</span>
        </div>
      </header>
      <div class="sidebar-tabs" role="tablist" aria-label="侧栏">
        <button type="button" class="sidebar-tab active" id="tab-sessions" role="tab" aria-selected="true" aria-controls="panel-sessions" tabindex="0">对话</button>
        <button type="button" class="sidebar-tab" id="tab-papers" role="tab" aria-selected="false" aria-controls="panel-papers" tabindex="-1">论文库</button>
      </div>
      <div class="sidebar-panel is-active" id="panel-sessions" role="tabpanel" aria-labelledby="tab-sessions">
        <div class="sidebar-actions">
          <button type="button" class="btn btn-primary" id="btn-new-session">新建对话</button>
        </div>
        <nav class="session-list" id="session-list" aria-label="对话列表"></nav>
      </div>
      <div class="sidebar-panel" id="panel-papers" role="tabpanel" aria-labelledby="tab-papers" hidden>
        <p class="paper-library-hint">语料来自 <code>configs/default.yaml</code> 与本地 PDF。</p>
        <nav class="paper-list" id="paper-list" aria-label="论文列表"></nav>
      </div>
      <footer class="sidebar-footer">
        <div class="status-row" id="health-status">
          <span class="status-dot" id="health-dot"></span>
          <span class="status-text" id="health-text">检查中…</span>
        </div>
        <label class="theme-label" for="theme-select">主题</label>
        <select id="theme-select" class="theme-select" aria-label="主题">
          <option value="ink">Ink</option>
          <option value="slate">Slate</option>
          <option value="sand">Sand</option>
        </select>
      </footer>
    </aside>

    <main class="main" id="main-pane">
      <header class="main-header">
        <h1 class="session-title" id="main-title">新对话</h1>
        <div class="main-header-actions">
          <button type="button" class="btn btn-ghost btn-sm" id="btn-archive" title="归档" disabled>归档</button>
          <button type="button" class="btn btn-ghost btn-sm btn-danger" id="btn-delete" title="删除" disabled>删除</button>
        </div>
      </header>

      <div class="messages" id="messages" role="log" aria-live="polite"></div>

      <div class="progress-dock" id="progress-dock" hidden>
        <div class="progress-bar"><span class="progress-fill" id="progress-fill"></span></div>
        <p class="progress-label" id="progress-label">思考中…</p>
        <ul class="progress-steps" id="progress-steps"></ul>
      </div>

      <aside class="paper-preview" id="paper-preview" hidden aria-label="论文预览">
        <header class="paper-preview-header">
          <div class="paper-preview-title-wrap">
            <h2 class="paper-preview-title" id="paper-preview-title">论文预览</h2>
            <p class="paper-preview-id" id="paper-preview-id"></p>
          </div>
          <div class="paper-preview-actions">
            <button type="button" class="btn btn-primary btn-sm" id="btn-insert-paper-query">插入提问</button>
            <button type="button" class="btn btn-ghost btn-sm" id="btn-close-paper-preview" aria-label="关闭预览">关闭</button>
          </div>
        </header>
        <div class="paper-preview-body">
          <p class="paper-preview-empty" id="paper-preview-empty" hidden>本地暂无 PDF，可先运行 download_pdfs.py。</p>
          <object class="paper-preview-object" id="paper-preview-object" type="application/pdf" title="PDF 预览"></object>
        </div>
      </aside>

      <form class="composer" id="composer-form">
        <textarea
          id="query-input"
          class="composer-input"
          rows="2"
          placeholder="提问论文库… 例如：检索增强生成（RAG）是什么？"
          autocomplete="off"
        ></textarea>
        <button type="submit" class="btn btn-primary composer-send" id="btn-send">发送</button>
      </form>
    </main>
  </div>

  <dialog class="inspector" id="inspector" aria-labelledby="inspector-title">
    <header class="inspector-header">
      <h2 id="inspector-title">回答详情</h2>
      <button type="button" class="btn btn-ghost btn-sm" id="inspector-close" aria-label="关闭">✕</button>
    </header>
    <div class="inspector-body" id="inspector-body"></div>
  </dialog>

  <dialog class="inspector session-dialog" id="confirm-dialog" aria-labelledby="confirm-dialog-title">
    <header class="inspector-header">
      <h2 id="confirm-dialog-title">删除对话</h2>
    </header>
    <div class="inspector-body session-dialog-body">
      <p class="session-dialog-message" id="confirm-dialog-message">删除后无法恢复，对话记录将从列表中移除。</p>
      <div class="session-dialog-actions">
        <button type="button" class="btn btn-ghost" id="confirm-dialog-cancel">取消</button>
        <button type="button" class="btn btn-danger-fill" id="confirm-dialog-ok">删除</button>
      </div>
    </div>
  </dialog>

  <dialog class="inspector session-dialog" id="rename-dialog" aria-labelledby="rename-dialog-title">
    <header class="inspector-header">
      <h2 id="rename-dialog-title">重命名对话</h2>
    </header>
    <form class="inspector-body session-dialog-body" id="rename-dialog-form" method="dialog">
      <label class="session-dialog-label" for="rename-dialog-input">标题</label>
      <input type="text" class="session-dialog-input" id="rename-dialog-input" name="title" autocomplete="off" maxlength="120" required>
      <div class="session-dialog-actions">
        <button type="button" class="btn btn-ghost" id="rename-dialog-cancel">取消</button>
        <button type="submit" class="btn btn-primary" id="rename-dialog-ok">确定</button>
      </div>
    </form>
  </dialog>

  <script src="/static/vendor/marked.umd.js"></script>
  <script src="/static/markdown.js"></script>
  <script src="/static/app.js" defer></script>
</body>
</html>
